<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>영어의 집 app shell test</title>
  <style>iframe { width: 390px; height: 844px; border: 0; }</style>
</head>
<body>
  <pre id="result">FAIL: page did not load</pre>
  <iframe id="app" src="../index.html"></iframe>
  <script>
    document.getElementById('app').addEventListener('load', function () {
      const w = this.contentWindow, d = w.document;
      const fails = [];
      const on = () => d.querySelector('.view.on') && d.querySelector('.view.on').id;
      const text = (sel) => (d.querySelector(sel) || {}).textContent || '';
      const visible = (sel) => { const e = d.querySelector(sel); return !!e && e.getBoundingClientRect().height > 0; };

      // ── 게이트 ──
      if (on() !== 'g-phone') fails.push('start view=' + on());
      if (visible('.tabbar')) fails.push('tabbar visible on gate');
      if (!visible('.gate-logo')) fails.push('gate logo missing');
      w.gatePhone('010-9999-9999'); w.gateGo();
      if (on() !== 'g-deny') fails.push('unknown phone should deny, got ' + on());
      w.back();
      w.gatePhone('010-1000-0001'); w.gateGo();
      if (on() !== 'g-code') fails.push('known phone should go to code, got ' + on());
      w.gateCode();
      if (w.ROLE !== 'd') fails.push('ROLE after director code=' + w.ROLE);
      if (on() !== 'd-today') fails.push('director lands on ' + on());

      // ── 원장 셸 ──
      const tabs = d.querySelectorAll('.tabbar a');
      if (tabs.length !== 4) fails.push('director tabs=' + tabs.length);
      if (!visible('.tabbar')) fails.push('tabbar hidden for director');
      const bar = d.querySelector('.tabbar').getBoundingClientRect();
      if (Math.abs(bar.bottom - w.innerHeight) > 2) fails.push('tabbar not at bottom');
      const de = d.documentElement;
      if (de.scrollWidth > de.clientWidth) fails.push('h-overflow');
      if (text('.appbar .badge') !== '1') fails.push('director bell badge=' + text('.appbar .badge'));

      // ── 원장: 오늘 / 더보기 ──
      if (d.querySelectorAll('#d-today .marks').length !== 3) fails.push('today ledger rows != 3 (고2 B)');
      if (d.querySelectorAll('#d-today .marks button.on.l').length !== 1) fails.push('김민수 지각 not marked');
      if (d.querySelectorAll('#d-today .marks button.on.a').length !== 1) fails.push('한지우 결석 not marked');
      if (d.querySelectorAll('#d-more .rw.soon').length !== 4) fails.push('준비 중 modules != 4');
      if (!d.querySelector('#d-roster') || d.querySelectorAll('#d-roster .rw').length !== 6) fails.push('roster rows != 6');
      if (!d.querySelector('#d-academy .appicon img')) fails.push('academy app icon missing');

      // ── 원장: 공지 ──
      if (d.querySelectorAll('#d-notice .post').length !== 4) fails.push('director notices != 4');
      if (!d.querySelector('#d-notice-new textarea')) fails.push('notice-new textarea missing');
      if (d.querySelectorAll('#d-notice-new .seg button').length !== 3) fails.push('notice target seg != 3 (전체/고1 A/고2 B)');

      // ── 원장: 문의 정합 ──
      const open = d.querySelectorAll('#d-inbox .tag.danger').length;
      if (open !== 1) fails.push('unanswered inquiries=' + open);
      if (String(open) !== text('.appbar .badge')) fails.push('inbox badge != unanswered');
      if (d.querySelectorAll('#d-inbox .rw').length !== 3) fails.push('inquiries != 3');
      if (d.querySelectorAll('#d-faq .faq').length !== 5) fails.push('faq items != 5');
      if (!d.querySelector('#d-answer textarea')) fails.push('answer textarea missing');

      // ── 라우터 ──
      w.tab('more');
      if (on() !== 'd-more') fails.push('tab(more) -> ' + on());
      w.tab('today'); w.push('roster');
      if (on() !== 'd-roster') fails.push('push(roster) -> ' + on());
      if (d.getElementById('bk').style.display !== 'grid') fails.push('back button hidden on sub view');
      w.back();
      if (on() !== 'd-today') fails.push('back -> ' + on());
      w.logout();
      if (on() !== 'g-phone' || w.ROLE !== null) fails.push('logout failed');

      // ── 학부모 / 학생 진입 ──
      w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (w.ROLE !== 'p' || on() !== 'p-child') fails.push('parent lands on ' + on());
      if (d.querySelectorAll('.tabbar a').length !== 4) fails.push('parent tabs');
      if (text('.appbar .badge') !== '2') fails.push('parent badge=' + text('.appbar .badge'));
      if (d.querySelectorAll('#p-child .week i').length !== 7) fails.push('child week != 7');
      if (d.querySelectorAll('#p-notice .post').length !== 3) fails.push('parent sees 3 notices (전체 2 + 고1 A 1), got ' + d.querySelectorAll('#p-notice .post').length);
      if (d.querySelectorAll('#p-ask .faq').length !== 5) fails.push('parent faq != 5');
      const dq = [...d.querySelectorAll('#d-faq .faq summary')].map(e => e.textContent.trim());
      const pq = [...d.querySelectorAll('#p-ask .faq summary')].map(e => e.textContent.trim());
      if (dq.join('|') !== pq.join('|')) fails.push('faq mismatch between director and parent');
      if (!d.querySelector('#p-ask-new textarea')) fails.push('ask-new textarea missing');
      w.logout();
      w.gatePhone('010-1234-0104'); w.gateGo(); w.gateCode();
      if (w.ROLE !== 's' || on() !== 's-me') fails.push('student lands on ' + on());
      if (d.querySelectorAll('.tabbar a').length !== 3) fails.push('student tabs');
      if (text('.appbar .badge') !== '1') fails.push('student badge=' + text('.appbar .badge'));
      if (d.querySelectorAll('#s-notice .post').length !== 3) fails.push('student notices != 3');
      if (!d.querySelector('#s-me .week i.l')) fails.push('김민수 오늘 지각 not shown');

      // ── 상태 연결: 역할 간에 데이터가 이어진다 ──
      w.logout(); w.gatePhone('010-1000-0001'); w.gateGo(); w.gateCode();
      w.push('notice-new'); d.getElementById('nn-title').value = '테스트 공지'; d.getElementById('nn-body').value = '본문'; w.postNotice();
      if (d.querySelectorAll('#d-notice .post').length !== 5) fails.push('director notices after post=' + d.querySelectorAll('#d-notice .post').length);
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (d.querySelectorAll('#p-notice .post').length !== 4) fails.push('parent notices after post=' + d.querySelectorAll('#p-notice .post').length);
      if (text('.appbar .badge') !== '3') fails.push('parent badge after post=' + text('.appbar .badge'));
      w.openNotice(w.DB.notices[0].id);
      if (w.DB.notices[0].readers.length !== 1) fails.push('readers after parent opened=' + w.DB.notices[0].readers.length);
      w.back(); w.push('ask-new'); d.getElementById('an-body').value = '테스트 문의'; w.sendAsk();
      w.logout(); w.gatePhone('010-1000-0001'); w.gateGo(); w.gateCode();
      if (d.querySelectorAll('#d-inbox .tag.danger').length !== 2) fails.push('unanswered after ask=' + d.querySelectorAll('#d-inbox .tag.danger').length);
      if (text('.appbar .badge') !== '2') fails.push('director badge after ask=' + text('.appbar .badge'));
      w.openAsk(w.DB.asks[0].id); d.getElementById('ans-body').value = '테스트 답변'; w.sendAnswer();
      if (d.querySelectorAll('#d-inbox .tag.danger').length !== 1) fails.push('unanswered after answer');
      w.tab('today'); w.att('김민수', 'a'); w.saveAtt();
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (text('.appbar .badge') !== '4') fails.push('parent badge after answer=' + text('.appbar .badge'));
      if (!/테스트 답변/.test(text('#p-ask-mine'))) fails.push('answer not shown in 내 문의');
      w.logout(); w.gatePhone('010-1234-0104'); w.gateGo(); w.gateCode();
      if (text('#s-today-tag') !== '결석') fails.push('student today tag=' + text('#s-today-tag'));
      if (text('.appbar .badge') !== '3') fails.push('student badge after post+att=' + text('.appbar .badge'));

      // ── 결석 사전 신청 + 보강 ──
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      const pb = +text('.appbar .badge');
      w.push('absence'); d.getElementById('ab-reason').value = '병원 진료'; w.sendAbsence();
      if (w.DB.absences[0].status !== '요청' || w.DB.absences[0].who !== 'p') fails.push('absence not created');
      if (!d.querySelector('#p-child .week i.a')) fails.push('planned absence not on week strip');
      w.logout(); w.gatePhone('010-1000-0001'); w.gateGo(); w.gateCode();
      if (d.querySelectorAll('#d-absence-list .tag.danger').length !== 2) fails.push('pending absences=' + d.querySelectorAll('#d-absence-list .tag.danger').length);
      w.openAbsence(w.DB.absences[0].id); w.mkPick(null, '6월 21일 토 2시'); w.confirmMakeup();
      if (w.DB.absences[0].status !== '보강 확정') fails.push('makeup not confirmed');
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (+text('.appbar .badge') !== pb + 1) fails.push('parent badge after makeup=' + text('.appbar .badge'));
      if (!/6월 21일/.test(text('#p-absence-list'))) fails.push('makeup not shown to parent');
      if (!d.querySelector('#p-child .week i.m')) fails.push('makeup not on week strip');

      // ── 학생: 이번 주 할 것 ──
      w.logout(); w.gatePhone('010-1234-0104'); w.gateGo(); w.gateCode();
      if (d.querySelectorAll('#s-me .todo').length !== 3) fails.push('student todos=' + d.querySelectorAll('#s-me .todo').length);
      if (d.querySelectorAll('#s-me .todo.done').length !== 1) fails.push('student done initially=' + d.querySelectorAll('#s-me .todo.done').length);
      if (text('#s-todo-left') !== '2개 남음') fails.push('todo left text=' + text('#s-todo-left'));
      const firstOpen = w.DB.todos.filter(t => t.cls === 'B' && !t.done)[0];
      w.toggleTodo(firstOpen.id);
      if (d.querySelectorAll('#s-me .todo.done').length !== 2) fails.push('toggle did not mark done');
      if (text('#s-todo-left') !== '1개 남음') fails.push('todo left after toggle=' + text('#s-todo-left'));
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (d.querySelectorAll('#p-child .todo').length < 1) fails.push('parent sees no todos for 고1 A');

      // ── 공지 안 읽은 사람 다시 알리기 ──
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      const pb2 = +text('.appbar .badge');
      w.logout(); w.gatePhone('010-1000-0001'); w.gateGo(); w.gateCode();
      w.openReaders(1);
      if (d.querySelectorAll('#d-readers .unread .rw').length !== 2) fails.push('unread for notice 1=' + d.querySelectorAll('#d-readers .unread .rw').length);
      if (d.querySelectorAll('#d-readers .readers .rw').length !== 4) fails.push('readers for notice 1=' + d.querySelectorAll('#d-readers .readers .rw').length);
      w.remind();
      if (!w.DB.notices.filter(n => n.id === 1)[0].remindedAt) fails.push('remindedAt not set');
      w.logout(); w.gatePhone('010-1234-0001'); w.gateGo(); w.gateCode();
      if (+text('.appbar .badge') !== pb2 + 1) fails.push('parent badge after remind=' + text('.appbar .badge'));
      if (!/아직/.test(text('#p-noti'))) fails.push('remind noti not shown to parent');

      // ── 카톡 알림 미리보기 ──
      w.logout(); w.gatePhone('010-1000-0001'); w.gateGo(); w.gateCode();
      w.push('kakao');
      const ob0 = w.DB.outbox.length, kc0 = d.querySelectorAll('#d-kakao .kcard').length;
      if (kc0 !== ob0 || ob0 < 3) fails.push('kakao cards ' + kc0 + ' != outbox ' + ob0);
      w.tab('notice'); w.push('notice-new'); d.getElementById('nn-title').value = '카톡 테스트 공지'; d.getElementById('nn-body').value = '본문'; w.postNotice();
      if (w.DB.outbox.length !== ob0 + 1 || w.DB.outbox[0].to !== '박지훈 어머님') fails.push('outbox after post=' + w.DB.outbox.length);
      w.push('kakao');
      if (d.querySelectorAll('#d-kakao .kcard').length !== kc0 + 1) fails.push('kakao cards after post');
      w.kakaoOpen(0);
      if (w.ROLE !== 'p' || on() !== 'p-notice-view') fails.push('kakao button did not open parent notice, got ' + w.ROLE + '/' + on());
      if (!/카톡 테스트 공지/.test(text('#p-nv'))) fails.push('opened notice is not the posted one');

      // ── 둘러보기 가이드: 14단계가 끊기지 않고 이어진다 ──
      w.guideStart();
      if (!w.GUIDE_ON || !d.getElementById('coach').classList.contains('on')) fails.push('guide did not start');
      if (on() !== 'g-phone' || !d.querySelector('.demo-keys button.gl')) fails.push('guide step 1 target not highlighted');
      for (let k = 1; k < w.GUIDE.length; k++) {
        w.guideNext();
        const st = w.GUIDE[k];
        const okView = Array.isArray(st.expect) ? st.expect.indexOf(on()) >= 0 : on() === st.expect;
        if (!okView) { fails.push('guide step ' + (k + 1) + ' expected ' + st.expect + ' got ' + on()); break; }
        if (st.target && !d.querySelector(st.target)) { fails.push('guide step ' + (k + 1) + ' target missing: ' + st.target); break; }
        if (st.target && !d.querySelector(st.target).classList.contains('gl')) { fails.push('guide step ' + (k + 1) + ' not highlighted'); break; }
      }
      w.guideNext();
      if (w.GUIDE_ON || d.getElementById('coach').classList.contains('on')) fails.push('guide did not end');

      // ── 이름 교체 ──
      if (d.body.innerHTML.indexOf('한빛') >= 0) fails.push('한빛 remains');
      if (d.head.innerHTML.indexOf('Gowun') >= 0) fails.push('Gowun Batang link remains');

      const result = fails.length === 0
        ? 'PASS: gate + 3 roles + router + overflow + live state + absence + todos + remind + kakao + guide'
        : 'FAIL: ' + fails.join(' | ');
      document.getElementById('result').textContent = result;
      document.title = result.startsWith('PASS:') ? 'PASS' : 'FAIL';
    });
  </script>
</body>
</html>
